<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元框架引擎 · Demo</title>
<style>
/* ===== Theme Variables ===== */
:root {
  --bg: #fafaf9;
  --bg2: #f4f3f1;
  --ink: #1a1a2e;
  --muted: #6b6b80;
  --rule: #e5e3df;
  --accent: #6366f1;
  --accent2: #ec4899;
  --accent-soft: rgba(99,102,241,0.08);
  --accent2-soft: rgba(236,72,153,0.08);
  --surface: #ffffff;
  --shadow: rgba(0,0,0,0.06);
  --shadow-lg: rgba(0,0,0,0.12);
  --green: #10b981;
  --green-soft: rgba(16,185,129,0.1);
  --orange: #f59e0b;
  --orange-soft: rgba(245,158,11,0.1);
  --red-soft: rgba(239,68,68,0.1);
}
[data-theme="dark"] {
  --bg: #0f0f1a;
  --bg2: #1a1a2e;
  --ink: #e4e4ef;
  --muted: #8888a8;
  --rule: #2a2a42;
  --accent: #818cf8;
  --accent2: #f472b6;
  --accent-soft: rgba(129,140,248,0.12);
  --accent2-soft: rgba(244,114,182,0.12);
  --surface: #1a1a2e;
  --shadow: rgba(0,0,0,0.3);
  --shadow-lg: rgba(0,0,0,0.4);
  --green: #34d399;
  --green-soft: rgba(52,211,153,0.12);
  --orange: #fbbf24;
  --orange-soft: rgba(251,191,36,0.12);
  --red-soft: rgba(248,113,113,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

/* ===== Glassmorphism Base ===== */
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  font-size: 16px;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  transition: background 0.3s, color 0.3s;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(99,102,241,0.10), transparent 50%),
    radial-gradient(ellipse 60% 40% at 90% 20%, rgba(236,72,153,0.07), transparent 50%),
    radial-gradient(ellipse 70% 50% at 50% 100%, rgba(99,102,241,0.05), transparent 50%);
  pointer-events: none; z-index: 0;
  transition: opacity 0.3s;
}
[data-theme="dark"] body::before {
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(129,140,248,0.14), transparent 50%),
    radial-gradient(ellipse 60% 40% at 90% 20%, rgba(244,114,182,0.10), transparent 50%),
    radial-gradient(ellipse 70% 50% at 50% 100%, rgba(129,140,248,0.08), transparent 50%);
}


/* ===== Theme Toggle ===== */
.theme-toggle {
  position: fixed; top: 1.2rem; right: 1.2rem; z-index: 999;
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--rule); background: var(--surface);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; transition: all 0.25s; box-shadow: 0 2px 8px var(--shadow);
}
.theme-toggle:hover { border-color: var(--accent); transform: scale(1.05); }
.theme-toggle .moon { display: block; }
.theme-toggle .sun { display: none; }
[data-theme="dark"] .theme-toggle .moon { display: none; }
[data-theme="dark"] .theme-toggle .sun { display: block; }

/* ===== App Container ===== */
#app {
  max-width: 720px; margin: 0 auto; padding: 2rem 1.5rem 4rem;
  position: relative; z-index: 1; min-height: 100vh;
}

/* ===== Top Bar ===== */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 2.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--rule);
}
.topbar .back-btn {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 0.85rem; font-family: inherit; padding: 0.3rem 0.6rem;
  border-radius: 6px; transition: all 0.15s;
}
.topbar .back-btn:hover { color: var(--accent); background: var(--accent-soft); }
.topbar .brand {
  font-weight: 700; font-size: 1rem; letter-spacing: 0.02em;
}
.topbar .brand .dot { color: var(--accent); }

/* ===== Pages ===== */
.page { display: none; animation: fadeIn 0.35s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes cardFadeIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }

/* ===== Home / Search Page (minimal) ===== */
.home-search {
  text-align: center;
  min-height: 70vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 0;
  transition: all 0.3s;
}
.home-search .big-logo {
  width: 96px; height: 96px; border-radius: 24px;
  margin-bottom: 1.5rem;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem; font-weight: 700; color: white;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.home-search[data-mode="fw"] .big-logo {
  background: linear-gradient(135deg, var(--accent), #818cf8);
  box-shadow: 0 16px 36px rgba(99,102,241,0.28);
}
.home-search[data-mode="dc"] .big-logo {
  background: linear-gradient(135deg, var(--accent2), #f472b6);
  box-shadow: 0 16px 36px rgba(236,72,153,0.28);
}
.home-search .brand-name {
  font-size: 1.3rem; font-weight: 700; margin-bottom: 2rem;
  letter-spacing: 0.02em;
}
.home-search[data-mode="fw"] .brand-name { color: var(--accent); }
.home-search[data-mode="dc"] .brand-name { color: var(--accent2); }

.home-search .search-wrap {
  width: 100%; max-width: 520px;
  position: relative;
}
.home-search .search-input {
  width: 100%; padding: 1rem 1.2rem;
  border: 2px solid var(--rule); border-radius: 14px;
  font-family: inherit; font-size: 1rem; background: var(--surface); color: var(--ink);
  transition: all 0.25s;
}
.home-search .search-input:focus {
  outline: none;
}
.home-search[data-mode="fw"] .search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.home-search[data-mode="dc"] .search-input:focus {
  border-color: var(--accent2);
  box-shadow: 0 0 0 4px var(--accent2-soft);
}
.home-search .search-input.error {
  border-color: var(--accent2);
  animation: shake 0.4s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.home-search .search-btn {
  margin-top: 1rem;
  padding: 0.9rem 2.5rem;
  border: none; border-radius: 12px;
  font-family: inherit; font-size: 0.95rem; font-weight: 600;
  color: white; cursor: pointer;
  transition: all 0.25s;
}
.home-search[data-mode="fw"] .search-btn {
  background: linear-gradient(135deg, var(--accent), #818cf8);
  box-shadow: 0 4px 16px rgba(99,102,241,0.25);
}
.home-search[data-mode="fw"] .search-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(99,102,241,0.3);
}
.home-search[data-mode="dc"] .search-btn {
  background: linear-gradient(135deg, var(--accent2), #f472b6);
  box-shadow: 0 4px 16px rgba(236,72,153,0.25);
}
.home-search[data-mode="dc"] .search-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(236,72,153,0.3);
}

/* Mode toggle pill */
.mode-pill {
  margin-top: 1.2rem;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 4px;
  background: var(--bg2);
  border-radius: 999px;
  border: 1px solid var(--rule);
}
.mode-pill button {
  padding: 0.35rem 0.9rem;
  border: none; background: transparent;
  border-radius: 999px;
  font-family: inherit; font-size: 0.78rem; font-weight: 500;
  color: var(--muted); cursor: pointer;
  transition: all 0.25s;
}
.mode-pill button.active.fw {
  background: var(--surface); color: var(--accent);
  box-shadow: 0 1px 4px var(--shadow);
}
.mode-pill button.active.dc {
  background: var(--surface); color: var(--accent2);
  box-shadow: 0 1px 4px var(--shadow);
}
.mode-pill .divider {
  width: 1px; height: 14px; background: var(--rule);
}

.home-search .hint-row {
  margin-top: 1rem;
  font-size: 0.78rem;
  color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 0.4rem;
}
.home-search .hint-row .obs {
  color: var(--accent);
  display: none;
}
.home-search[data-mode="fw"] .hint-row .obs { display: inline; }

.home-search .quick-examples {
  margin-top: 1.5rem;
  display: flex; gap: 0.5rem; flex-wrap: wrap;
  justify-content: center;
  max-width: 520px;
}
.home-search .quick-ex {
  font-size: 0.8rem;
  padding: 0.4rem 0.9rem;
  border-radius: 8px;
  background: var(--bg2); color: var(--muted);
  cursor: pointer;
  border: 1px solid var(--rule);
  transition: all 0.15s;
}
.home-search .quick-ex:hover {
  border-color: var(--accent); color: var(--accent);
}
.home-search[data-mode="dc"] .quick-ex:hover {
  border-color: var(--accent2); color: var(--accent2);
}

/* ===== Loading Page ===== */
.loading-page { text-align: center; padding: 3rem 0; }
.gen-spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--rule);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 1.5rem;
  position: relative;
}
.gen-spinner::after {
  content: '';
  position: absolute;
  inset: -6px;
  border: 2px solid transparent;
  border-top-color: var(--accent2);
  border-radius: 50%;
  animation: spin 1.2s linear infinite reverse;
  opacity: 0.5;
}
@keyframes spin { to { transform: rotate(360deg); } } }
.gen-text { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.4rem; }
.gen-sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 1.5rem; }
.gen-steps { max-width: 360px; margin: 0 auto; text-align: left; }
.gen-step {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.5rem 0; font-size: 0.84rem; color: var(--muted);
  border-bottom: 1px solid var(--rule); transition: all 0.3s;
}
.gen-step:last-child { border-bottom: none; }
.gen-step.done { color: var(--ink); }
.gen-step.done .step-icon { color: var(--green); }
.gen-step.active { color: var(--accent); font-weight: 600; }
.gen-step.active .step-icon { color: var(--accent); }
.step-icon { width: 20px; text-align: center; font-size: 0.9rem; }

/* ===== Progressive View ===== */
.prog-view { padding: 0.5rem 0; }
.prog-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;
}
.prog-breadcrumb { display: flex; align-items: center; gap: 0.3rem; font-size: 0.78rem; flex-wrap: wrap; }
.crumb {
  color: var(--muted); cursor: pointer; padding: 0.2rem 0.5rem;
  border-radius: 5px; transition: all 0.15s;
}
.crumb:hover { background: var(--accent-soft); color: var(--accent); }
.crumb.active { color: var(--accent); font-weight: 700; background: var(--accent-soft); }
.crumb-sep { color: var(--rule); }
.export-trigger {
  background: var(--bg2); border: 1px solid var(--rule); border-radius: 8px;
  padding: 0.35rem 0.8rem; font-size: 0.78rem; cursor: pointer; color: var(--muted);
  font-family: inherit; transition: all 0.15s;
}
.export-trigger:hover { border-color: var(--accent); color: var(--accent); }

.layer-stack { display: flex; gap: 0.4rem; margin-bottom: 1.5rem; }
.layer-bar { flex: 1; height: 5px; border-radius: 3px; background: var(--rule); transition: background 0.3s; }
.layer-bar.done { background: var(--accent); }
.layer-bar.current { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
[data-path="dc"] .layer-bar.done { background: var(--accent2); }
[data-path="dc"] .layer-bar.current { background: linear-gradient(90deg, var(--accent2), #f472b6); }

.layer-content { display: none; animation: cardFadeIn 0.3s ease; }
.layer-content.active { display: block; }

/* Layer 1: Concept */
.layer-concept { text-align: center; padding: 1rem 0 1.5rem; }
.layer-concept .c-tag {
  font-size: 0.72rem; color: var(--muted); font-family: 'JetBrains Mono', monospace;
  margin-bottom: 0.6rem; letter-spacing: 0.05em;
}
.layer-concept .c-name { font-size: 2rem; font-weight: 700; margin-bottom: 0.8rem; }
.layer-concept .c-def { font-size: 1rem; color: var(--ink); line-height: 1.7; margin-bottom: 0.8rem; max-width: 560px; margin-left: auto; margin-right: auto; }
.layer-concept .c-essence {
  font-size: 0.86rem; color: var(--muted); font-style: italic;
  padding: 0.6rem 1rem; background: var(--bg2); border-radius: 8px;
  display: inline-block; max-width: 500px;
}

/* Layer 1: Decision Conclusion */
.layer-conclusion { text-align: center; padding: 1rem 0 1.5rem; }
.layer-conclusion .q-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; color: var(--muted); }
.verdict-badge {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.5rem 1.2rem; border-radius: 10px; font-size: 1rem; font-weight: 700;
  margin-bottom: 1rem;
}
.verdict-badge.yes { background: var(--green-soft); color: var(--green); }
.verdict-badge.no { background: var(--red-soft); color: #ef4444; }
.verdict-badge.cond { background: var(--orange-soft); color: var(--orange); }
.conclusion-text { font-size: 0.95rem; color: var(--ink); line-height: 1.7; max-width: 540px; margin: 0 auto 0.8rem; }
.tradeoff-text { font-size: 0.84rem; color: var(--muted); max-width: 480px; margin: 0 auto; }

/* Layer 2: System / Dimensions - pagination */
.sub-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 0.8rem;
}
.module-counter { font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; color: var(--muted); font-weight: 700; }
.module-counter .cur { color: var(--accent); }
[data-path="dc"] .module-counter .cur { color: var(--accent2); }
.module-dots { display: flex; gap: 0.3rem; }
.mod-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--rule);
  transition: all 0.2s; cursor: pointer;
}
.mod-dot.active { background: var(--accent); width: 22px; border-radius: 4px; }
.mod-dot.done { background: rgba(99,102,241,0.3); }
[data-path="dc"] .mod-dot.active { background: var(--accent2); }
[data-path="dc"] .mod-dot.done { background: rgba(236,72,153,0.3); }

.sys-card {
  border: 1px solid var(--rule); border-radius: 12px; padding: 1.4rem;
  background: var(--surface); transition: all 0.2s; animation: cardFadeIn 0.3s ease;
}
.sys-card .s-num { font-size: 0.72rem; font-family: 'JetBrains Mono', monospace; color: var(--accent); font-weight: 700; margin-bottom: 0.3rem; }
[data-path="dc"] .sys-card .s-num { color: var(--accent2); }
.sys-card .s-name { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.6rem; }
.sys-card .s-desc { font-size: 0.88rem; color: var(--muted); line-height: 1.65; }
.sys-card .s-type {
  display: inline-block; font-size: 0.72rem; padding: 0.15rem 0.5rem;
  border-radius: 5px; margin-bottom: 0.5rem; font-weight: 600;
}
.s-type.pro { background: var(--green-soft); color: var(--green); }
.s-type.con { background: var(--red-soft); color: #ef4444; }
.s-type.risk { background: var(--orange-soft); color: var(--orange); }
.s-type.cond { background: var(--accent-soft); color: var(--accent); }

/* SVG visual in sys-card */
.s-visual {
  margin-top: 0.8rem;
  padding: 0.8rem 0.4rem 0.4rem;
  border-top: 1px solid var(--rule);
  display: flex; justify-content: center;
  overflow-x: auto;
}
.s-visual svg { max-width: 100%; height: auto; }
.s-visual svg text { font-family: -apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
.s-visual svg .node-rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; rx: 6; }
.s-visual svg .node-text { fill: var(--accent); font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
.s-visual svg .conn-line { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.s-visual svg .conn-arrow { fill: var(--accent); }
.s-visual svg .pill { fill: var(--bg2); stroke: var(--rule); stroke-width: 1; rx: 6; }
.s-visual svg .pill-text { fill: var(--ink); font-size: 10px; text-anchor: middle; dominant-baseline: middle; }
.s-visual svg .venn-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; opacity: 0.7; }
.s-visual svg .venn-b { fill: var(--accent2-soft); stroke: var(--accent2); stroke-width: 1.5; opacity: 0.7; }
.s-visual svg .venn-text { fill: var(--ink); font-size: 9px; text-anchor: middle; }
.s-visual svg .tag-rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; rx: 4; }
.s-visual svg .tag-text { fill: var(--accent); font-size: 9px; text-anchor: middle; dominant-baseline: middle; }
.s-visual svg .challenge-badge { fill: var(--accent2); }
.s-visual svg .challenge-text { fill: var(--ink); font-size: 10px; }
.s-visual svg .timeline-dot { fill: var(--accent); }
.s-visual svg .timeline-line { stroke: var(--rule); stroke-width: 2; }
.s-visual svg .timeline-text { fill: var(--ink); font-size: 9px; text-anchor: middle; }
.s-visual svg .frontier-node { fill: white; stroke: var(--accent); stroke-width: 1.5; rx: 6; }
[data-theme="dark"] .s-visual svg .frontier-node { fill: var(--surface); }
.s-visual svg .frontier-text { fill: var(--ink); font-size: 9px; text-anchor: middle; dominant-baseline: middle; }
.s-visual svg .mapping-arrow { stroke: var(--accent); stroke-width: 1.5; fill: none; }
.s-visual svg .mapping-from { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; rx: 4; }
.s-visual svg .mapping-to { fill: var(--green-soft); stroke: var(--green); stroke-width: 1; rx: 4; }
.s-visual svg .mapping-text { fill: var(--ink); font-size: 9px; text-anchor: middle; dominant-baseline: middle; }

.sub-nav-btns { display: flex; gap: 0.6rem; margin-top: 1rem; }
.prev-btn, .next-btn {
  flex: 1; background: var(--surface); border: 1px solid var(--rule);
  border-radius: 10px; padding: 0.7rem 1rem; font-size: 0.84rem;
  cursor: pointer; font-family: inherit; color: var(--ink); transition: all 0.15s;
  text-align: center; display: block; min-height: 44px;
}
.prev-btn:hover:not(:disabled), .next-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
[data-path="dc"] .prev-btn:hover:not(:disabled), [data-path="dc"] .next-btn:hover:not(:disabled) { border-color: var(--accent2); color: var(--accent2); }
.prev-btn:disabled, .next-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.enter-btn {
  display: block; width: 100%; margin-top: 0.8rem;
  padding: 0.8rem; border: none; border-radius: 10px;
  font-family: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer;
  background: var(--accent); color: white; transition: all 0.2s;
}
.enter-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px var(--accent-soft); }
[data-path="dc"] .enter-btn { background: var(--accent2); }
[data-path="dc"] .enter-btn:hover { box-shadow: 0 4px 14px var(--accent2-soft); }

/* Layer 3: Learning Path */
.layer-path { padding: 0.5rem 0; }
.path-track { display: flex; flex-direction: column; gap: 0.8rem; }
.path-node {
  border: 1px solid var(--rule); border-radius: 12px; padding: 1.2rem;
  background: var(--surface); position: relative; padding-left: 3rem;
}
.path-node::before {
  content: ''; position: absolute; left: 1.2rem; top: 1.2rem;
  width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
}
.path-node:not(:last-child)::after {
  content: ''; position: absolute; left: 1.65rem; top: 2rem;
  width: 2px; height: calc(100% - 1.5rem); background: var(--rule);
}
.path-node .p-stage { font-weight: 700; font-size: 1rem; margin-bottom: 0.3rem; }
.path-node .p-time { font-size: 0.76rem; color: var(--accent); font-family: 'JetBrains Mono', monospace; margin-left: 0.4rem; }
.path-node .p-content { font-size: 0.86rem; color: var(--muted); line-height: 1.6; }

/* Layer 3: Action Suggestions */
.layer-action { padding: 0.5rem 0; }
.action-section { margin-bottom: 1.2rem; }
.action-section h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.6rem; color: var(--accent2); }
.action-list { list-style: none; }
.action-item {
  display: flex; gap: 0.6rem; padding: 0.6rem 0;
  font-size: 0.86rem; border-bottom: 1px solid var(--rule);
}
.action-item:last-child { border-bottom: none; }
.action-item .a-num {
  width: 22px; height: 22px; border-radius: 50%; background: var(--accent2-soft);

/* ===== Export Page ===== */
.export-page { text-align: center; padding: 2rem 0; }
.export-page h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.4rem; }
.export-page .hint { font-size: 0.84rem; color: var(--muted); margin-bottom: 1.5rem; }

.export-options { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; }
.export-option {

  cursor: pointer; background: var(--surface); transition: all 0.2s; text-align: center;

/* ===== Toast ===== */

.toast .obsidian-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* ===== Obsidian Panel ===== */

/* ===== Card Expansion ===== */
.sys-card {
  cursor: pointer;
  overflow: hidden;
}
.sys-card .card-detail {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
              opacity 0.35s ease 0.1s,
              margin 0.3s ease;
  margin-top: 0;
}
.sys-card.expanded .card-detail {
  max-height: 300px;
  opacity: 1;
  margin-top: 1rem;
}
.sys-card .expand-hint {
  font-size: 0.7rem;
  color: var(--muted);
  text-align: center;
  margin-top: 0.6rem;
  opacity: 0.6;
  transition: opacity 0.2s;
}
.sys-card:hover .expand-hint {
  opacity: 1;
}
.sys-card.expanded .expand-hint {
  display: none;
}

/* ===== Custom Cursor ===== */
.custom-cursor {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  border-radius: 50%;
  mix-blend-mode: difference;
}
.cursor-main {
  width: 20px; height: 20px;
  border: 2px solid rgba(99,102,241,0.6);
  background: rgba(99,102,241,0.1);
  transition: transform 0.15s ease-out, width 0.2s, height 0.2s;
}
.cursor-main.hovering {
  width: 40px; height: 40px;
  border-color: rgba(236,72,153,0.5);
  background: rgba(236,72,153,0.08);
}
.cursor-trail {
  width: 8px; height: 8px;
  background: rgba(99,102,241,0.3);
  transition: transform 0.08s ease-out;
}
.cursor-trail:nth-child(3) { width: 6px; height: 6px; background: rgba(99,102,241,0.2); }
.cursor-trail:nth-child(4) { width: 4px; height: 4px; background: rgba(99,102,241,0.12); }
.cursor-trail:nth-child(5) { width: 3px; height: 3px; background: rgba(99,102,241,0.08); }

/* Hide default cursor on desktop */
@media (hover: hover) and (pointer: fine) {
  body { cursor: none; }
  a, button, input, .sys-card, .history-item, .export-option, .quick-ex, .mod-dot, .crumb {
    cursor: none;
  }
}

  .topbar { flex-wrap: wrap; gap: 0.5rem; }
  .topbar .brand { font-size: 0.9rem; }
  .prog-header { flex-direction: column; gap: 0.6rem; align-items: flex-start; }
  .layer-content { padding: 0.8rem; }
  .sys-card { padding: 1rem; }
  .s-visual svg { max-width: 100%; height: auto; }
  .export-page { padding: 0 0.5rem; }
  .path-node { padding: 0.8rem 1rem; }
  .obs-panel { left: 0.5rem; right: 0.5rem; max-width: none; }
  .history-section { padding: 0 0.5rem; }
}
@media (max-width: 480px) {
  .home-search .big-logo { width: 60px; height: 60px; font-size: 1.6rem; }

/* ===== Enhanced Loading ===== */

}

/* ===== SVG Interaction ===== */
.s-visual svg { max-width: 100%; }
.s-visual .pill, .s-visual .node-rect, .s-visual .frontier-node, .s-visual .mapping-to, .s-visual .mapping-from, .s-visual .tag-rect {
  transition: all 0.2s;
  cursor: pointer;
}
.s-visual .pill:hover, .s-visual .node-rect:hover, .s-visual .frontier-node:hover, .s-visual .mapping-to:hover, .s-visual .mapping-from:hover {
  filter: brightness(1.1);
  transform: scale(1.02);
  transform-origin: center;
}
.s-visual .conn-line, .s-visual .timeline-line, .s-visual .mapping-arrow {

/* ===== Smooth scroll & selection ===== */
::selection {

// ===== Theme Toggle =====
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  if (isDark) {
    html.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
  } else {
    html.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
  }
}

// Restore theme on load
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
})();

// ===== Page Navigation =====
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  window.scrollTo(0, 0);
}

// ===== Custom Cursor =====
function initCursor() {
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  const cursorMain = document.createElement('div');
  cursorMain.className = 'custom-cursor cursor-main';
  document.body.appendChild(cursorMain);

  const trails = [];
  for (let i = 0; i < 4; i++) {
    const t = document.createElement('div');
    t.className = 'custom-cursor cursor-trail';
    document.body.appendChild(t);
    trails.push({ el: t, x: 0, y: 0 });
  }

  let mx = 0, my = 0;
  let cx = 0, cy = 0;

  document.addEventListener('mousemove', e => {
    mx = e.clientX;
    my = e.clientY;
  });

  // Hover detection on interactive elements
  const hoverSelector = 'a, button, input, .sys-card, .history-item, .export-option, .quick-ex, .mod-dot, .crumb, .path-node, .layer-concept, .layer-conclusion, .alt-card, .action-section';
  document.addEventListener('mouseover', e => {
    if (e.target.closest(hoverSelector)) cursorMain.classList.add('hovering');
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest(hoverSelector)) cursorMain.classList.remove('hovering');
  });

  function animate() {
    // Main cursor follows with slight lag for smooth feel
    cx += (mx - cx) * 0.35;
    cy += (my - cy) * 0.35;
    const isHovering = cursorMain.classList.contains('hovering');
    const half = isHovering ? 20 : 10;
    cursorMain.style.transform = 'translate(' + (cx - half) + 'px, ' + (cy - half) + 'px)';

    // Trails follow with increasing delay
    trails.forEach((trail, i) => {
      trail.x += (mx - trail.x) * (0.3 - i * 0.06);
      trail.y += (my - trail.y) * (0.3 - i * 0.06);
      const size = 8 - i * 1.5;
      trail.el.style.transform = 'translate(' + (trail.x - size/2) + 'px, ' + (trail.y - size/2) + 'px)';
    });

    requestAnimationFrame(animate);
  }
  animate();
}

// ===== Keyboard Shortcuts =====
function setupKeyboard() {
  const hintEl = document.getElementById('kbHint');
  let hintTimer = null;
  function showHint(text) {
    hintEl.textContent = text;
    hintEl.classList.add('show');
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hintEl.classList.remove('show'), 2000);
  }
  document.addEventListener('keydown', function(e) {
    // Only when not typing in input
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 't' || e.key === 'T') { toggleTheme(); showHint('T = 切换主题'); }
    if (e.key === 'Escape') {
      const activePage = document.querySelector('.page.active');
      if (activePage.id === 'page-loading') cancelLoading();
      else if (activePage.id === 'page-prog') showPage('home');
      else if (activePage.id === 'page-export') showPage('prog');
    }
    if (e.key === 'ArrowLeft') {
      const activePage = document.querySelector('.page.active');
      if (activePage.id === 'page-prog' && currentLayer === 1) goToPrevModule();
    }
    if (e.key === 'ArrowRight') {
      const activePage = document.querySelector('.page.active');
      if (activePage.id === 'page-prog' && currentLayer === 1) goToNextModule();
    }
  });
}

// ===== Search / Generate =====
function handleSearch() {
  const input = document.getElementById('searchInput');
  let val = input.value.trim();
  if (!val) {
    input.classList.add('error');
    setTimeout(() => input.classList.remove('error'), 400);
    return;
  }

  // Check if we have mock data
  const db = currentPath === 'fw' ? MOCK.framework : MOCK.decision;
  if (!db[val]) {
    const keys = Object.keys(db);
    if (keys.length > 0) val = keys[0];
  }

  currentData = db[val];
  if (!currentData) {
    showToast('暂无该' + (currentPath === 'fw' ? '概念' : '问题') + '的模拟数据，请使用示例词条');
    return;
  }

  // Save to history
  saveHistory(val, currentPath);
  startLoading(val);
}

function startLoading(query) {
  showPage('loading');
  const loadText = document.getElementById('loadText');
  const loadSub = document.getElementById('loadSub');
  const steps = document.getElementById('loadSteps');

  if (currentPath === 'fw') {
    loadText.textContent = '正在为「' + query + '」构建认知框架';
    loadSub.textContent = 'LLM 正在生成三层渐进结构';
    const fwSteps = [
      '解析概念', '生成第一层：概念核心定义',
      '生成第二层：框架体系', '生成第三层：学习路径'
    ];
    steps.innerHTML = '';
    fwSteps.forEach((s, i) => {
      const d = document.createElement('div');
      d.className = 'gen-step' + (i === 0 ? ' done' : '');
      d.innerHTML = '<span class="step-icon">' + (i === 0 ? '✓' : '○') + '</span>' + s;
      steps.appendChild(d);
    });

    let stepIdx = 0;
    const progressFill = document.getElementById('progressFill');
    loadingTimer = setInterval(() => {
      stepIdx++;
      if (progressFill) progressFill.style.width = (stepIdx / 4 * 100) + '%';
      const allSteps = steps.querySelectorAll('.gen-step');
      if (stepIdx < allSteps.length) {
        allSteps[stepIdx - 1].className = 'gen-step done';
        allSteps[stepIdx - 1].querySelector('.step-icon').textContent = '✓';
        allSteps[stepIdx].className = 'gen-step active';
        allSteps[stepIdx].querySelector('.step-icon').textContent = '▸';
      } else {
        allSteps[allSteps.length - 1].className = 'gen-step done';
        allSteps[allSteps.length - 1].querySelector('.step-icon').textContent = '✓';
        clearInterval(loadingTimer);
        setTimeout(() => renderProgressiveView(), 600);
      }
    }, 800);
  } else {
    loadText.textContent = '正在为「' + query + '」生成决策建议';
    loadSub.textContent = 'LLM 正在生成三层渐进结构';
    const dcSteps = [
      '解析问题', '生成第一层：结论与权衡',
      '生成第二层：支撑维度', '生成第三层：行动建议'
    ];
    steps.innerHTML = '';
    dcSteps.forEach((s, i) => {
      const d = document.createElement('div');
      d.className = 'gen-step' + (i === 0 ? ' done' : '');
      d.innerHTML = '<span class="step-icon">' + (i === 0 ? '✓' : '○') + '</span>' + s;
      steps.appendChild(d);
    });

    let dcIdx = 0;
    const progressFill2 = document.getElementById('progressFill');
    loadingTimer = setInterval(() => {
      dcIdx++;
      if (progressFill2) progressFill2.style.width = (dcIdx / 4 * 100) + '%';
      const allSteps = steps.querySelectorAll('.gen-step');
      if (dcIdx < allSteps.length) {
        allSteps[dcIdx - 1].className = 'gen-step done';
        allSteps[dcIdx - 1].querySelector('.step-icon').textContent = '✓';
        allSteps[dcIdx].className = 'gen-step active';
        allSteps[dcIdx].querySelector('.step-icon').textContent = '▸';
      } else {
        allSteps[allSteps.length - 1].className = 'gen-step done';
        allSteps[allSteps.length - 1].querySelector('.step-icon').textContent = '✓';

        setTimeout(() => renderProgressiveView(), 600);

function renderFrameworkLayers(view) {

      '<div class="s-num">' + m.num + '</div>' +
      '<div class="s-name">' + m.name + '</div>' +
      '<div class="s-desc">' + m.desc + '</div>' +
      (svg ? '<div class="s-visual">' + svg + '</div>' : '') +
      detailHtml +
      '<div class="expand-hint">点击展开详情 ↓</div>' +

      '<div class="module-dots" id="modDots">' + dotsHtml + '</div>' +

    '<div id="sysStack">' + cardsHtml + '</div>' +
    '<div class="sub-nav-btns">' +
      '<button class="prev-btn" id="prevMod" onclick="goToPrevModule()" disabled>← 上一个模块</button>' +
      '<button class="next-btn" id="nextMod" onclick="goToNextModule()">下一个模块 →</button>' +
    '</div>' +
    '<button class="enter-btn" id="enterPath" onclick="goToLayer(2)" style="display:none">进入学习路径 →</button>';
  view.appendChild(l1);

  // Layer 2: Learning Path
  var l2 = document.createElement('div');
  l2.className = 'layer-content';
  l2.id = 'layer2';
  var pathHtml = '';
  d.path.forEach(function(p) {

// ===== Layer Navigation =====
function goToLayer(idx) {
  currentLayer = idx;
  document.querySelectorAll('.layer-content').forEach((l, i) => {
    l.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.crumb').forEach((c, i) => {
    c.classList.toggle('active', i === idx);
  });
  const bars = document.querySelectorAll('.layer-bar');
  bars.forEach(function(b, i) {
    b.className = 'layer-bar' + (i < idx ? ' done' : (i === idx ? ' current' : ''));
  });
  // Reset module when entering layer 1
  if (idx === 1) {
    currentModule = 0;
    setTimeout(function() { updateModuleView(); }, 0);
  }
  // Show Obsidian sync status when reaching the last layer (framework path only)
  if (idx === 2 && currentPath === 'fw') {
    showObsidianComplete();
  } else {
    hideObsidianPanel();
  }
  window.scrollTo(0, 0);
}

// ===== Module Navigation =====
function goToModule(idx) {
  currentModule = idx;
  updateModuleView();
}
function goToPrevModule() {
  if (currentModule > 0) {
    currentModule--;
    updateModuleView();
  }
}
function goToNextModule() {
  var total = getTotalModules();
  if (currentModule < total - 1) {
    currentModule++;
    updateModuleView();
  }
}
function getTotalModules() {
  const stack = document.getElementById('sysStack');
  if (!stack) return 0;
  return stack.querySelectorAll('.sys-card').length;
}
function updateModuleView() {
  const stack = document.getElementById('sysStack');
  if (!stack) { return; }
  const cards = stack.querySelectorAll('.sys-card');
  const total = cards.length;
  if (total === 0) { return; }
  if (currentModule < 0) currentModule = 0;
  if (currentModule > total - 1) currentModule = total - 1;

  for (let i = 0; i < cards.length; i++) {
    cards[i].style.display = (i === currentModule) ? 'block' : 'none';
  }

  const dots = document.querySelectorAll('#modDots .mod-dot');
  for (let j = 0; j < dots.length; j++) {
    dots[j].className = 'mod-dot' + (j === currentModule ? ' active' : (j < currentModule ? ' done' : ''));
  }

  const modCurEl = document.getElementById('modCur');
  if (modCurEl) modCurEl.textContent = String(currentModule + 1).padStart(2, '0');

  const prevBtn = document.getElementById('prevMod');
  if (prevBtn) prevBtn.disabled = (currentModule === 0);

  const nextBtn = document.getElementById('nextMod');
  if (nextBtn) {
    if (currentModule === total - 1) {
      nextBtn.style.display = 'none';
    } else {
      nextBtn.style.display = '';
      nextBtn.disabled = false;
    }
  }

  const enterBtn = document.getElementById('enterPath');
  if (enterBtn) enterBtn.style.display = (currentModule === total - 1) ? '' : 'none';
}

          svg += '<text x="' + (gp.x + 202) + '" y="' + (gp.y + 21) + '" text-anchor="middle" font-size="7" fill="white" font-weight="600">$1M</text>';
        }
        svg += '<text x="' + (gp.x + 40) + '" y="' + (gp.y + 38) + '" fill="var(--muted)" font-size="8">' + esc(G.trunc(detail, 22)) + '</text>';
        svg += '<text x="' + (gp.x + 40) + '" y="' + (gp.y + 52) + '" fill="var(--muted)" font-size="7">' + (isMillennium ? '★ 千禧年大奖难题' : '○ 开放问题') + '</text>';
      }
      svg += '</svg>';
      break;

    case 6: // 关键概念索引 → Tag cloud (grid-aligned)
      var rawTags = m.desc.replace(/。$/,'').split(/[、，,]/);
      var tags6 = [];
      rawTags.forEach(function(t) {
        var clean = t.replace(/[（(][^）)]*[）)]/g,'').trim();
        if (!clean) return;
        var parts = clean.split(/[/／]/);
        parts.forEach(function(p) {
          p = p.trim();
          if (p && p.length <= 10 && tags6.indexOf(p) < 0) tags6.push(p);
        });
      });
      svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
      for (var ti6 = 0; ti6 < Math.min(tags6.length, 20); ti6++) {
        var col = ti6 % 4, row = Math.floor(ti6 / 4);
        var tx = G.col(col) + 2, ty = G.row(row) + 2;
        var tag = G.trunc(tags6[ti6], 8);
        var tw = 120, th = 32;
        var fs = tag.length > 5 ? 8 : 9;
        var opacity = 0.65 + (ti6 % 3) * 0.1;
        svg += '<rect class="tag-rect" x="' + tx + '" y="' + ty + '" width="' + tw + '" height="' + th + '" rx="4" opacity="' + opacity + '"/>';
        svg += '<text class="tag-text" x="' + (tx + tw/2) + '" y="' + (ty + th/2 + 1) + '" font-size="' + fs + '">' + esc(tag) + '</text>';
      }
      svg += '</svg>';
      break;

    case 7: // 领域交叉 → Venn diagram (3 circles)
      var crossItems = m.desc.replace(/。$/,'').split(/[、，,]/);
      svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
        '<circle class="venn-a" cx="170" cy="95" r="75"/>' +
        '<circle class="venn-b" cx="350" cy="95" r="75"/>' +
        '<circle cx="' + G.cx + '" cy="160" r="55" fill="var(--green-soft)" stroke="var(--green)" stroke-width="1.5" opacity="0.7"/>' +
        '<text class="venn-text" x="115" y="55" font-weight="700" font-size="10">' + G.trunc(conceptName, 4) + '</text>' +
        '<text class="venn-text" x="380" y="55" font-weight="700" font-size="10">其他学科</text>' +
        '<text x="' + G.cx + '" y="178" text-anchor="middle" font-size="9" fill="var(--green)" font-weight="700">应用领域</text>' +
        '<text class="venn-text" x="' + G.cx + '" y="82" font-size="8" fill="var(--accent2)" font-weight="600">交叉领域</text>';
      for (var vi = 0; vi < Math.min(crossItems.length, 3); vi++) {
        var vItem = crossItems[vi].trim().replace(/[（(][^）)]*[）)]/g,'');
        var vy = 96 + vi * 13;
        svg += '<text class="venn-text" x="' + G.cx + '" y="' + vy + '" font-size="7" fill="var(--muted)">' + esc(G.trunc(vItem, 8)) + '</text>';
      }
      svg += '<text class="venn-text" x="105" y="95" font-size="7" fill="var(--accent)">理论核心</text>' +
        '<text class="venn-text" x="105" y="108" font-size="7" fill="var(--accent)">公理方法</text>' +
        '<text class="venn-text" x="105" y="121" font-size="7" fill="var(--accent)">严格证明</text>' +
        '<text class="venn-text" x="385" y="95" font-size="7" fill="var(--accent2)">实验方法</text>' +
        '<text class="venn-text" x="385" y="108" font-size="7" fill="var(--accent2)">数据驱动</text>' +
        '<text class="venn-text" x="385" y="121" font-size="7" fill="var(--accent2)">经验验证</text>';
      svg += '</svg>';
      break;

    case 8: // 实用价值映射 → Mapping arrows
      var apps8 = m.desc.replace(/。$/,'').split(/[、，,]/);
      svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
        '<defs><marker id="map-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker></defs>' +
        '<rect class="mapping-from" x="14" y="85" width="90" height="40" rx="6"/>' +
        '<text class="mapping-text" x="59" y="101" font-size="9" font-weight="700">' + G.trunc(conceptName, 4) + '</text>' +
        '<text x="59" y="114" text-anchor="middle" font-size="7" fill="var(--accent)">核心理论</text>';
      var ap8 = [
        {x:160,y:14},{x:320,y:14},{x:160,y:65},{x:320,y:65},
        {x:160,y:116},{x:320,y:116},{x:160,y:167},{x:320,y:167}
      ];
      for (var ai8 = 0; ai8 < Math.min(apps8.length, ap8.length); ai8++) {
        var p = ap8[ai8];
        var appText = apps8[ai8].trim().replace(/——.*/,'');
        var sx = 104, sy = 105, ex = p.x, ey = p.y + 17;
        svg += '<path class="mapping-arrow" d="M' + sx + ' ' + sy + ' C' + (sx+30) + ' ' + sy + ' ' + (ex-30) + ' ' + ey + ' ' + ex + ' ' + ey + '"/>';
        svg += '<rect class="mapping-to" x="' + p.x + '" y="' + p.y + '" width="150" height="34" rx="5"/>';
        svg += '<text class="mapping-text" x="' + (p.x + 75) + '" y="' + (p.y + 15) + '">' + esc(G.trunc(appText, 14)) + '</text>';
        svg += '<text x="' + (p.x + 130) + '" y="' + (p.y + 28) + '" text-anchor="middle" font-size="7" fill="var(--accent2)">' + ['★★★','★★','★'][ai8 % 3] + '</text>';
      }
      svg += '<text x="' + G.cx + '" y="210" text-anchor="middle" font-size="8" fill="var(--muted)">' + esc(conceptName) + '是现代文明的隐性基础设施</text>';
      svg += '</svg>';
      break;

    case 9: // 常见误区 → Warning icons with corrections
      var miscs = parseItems(m.desc, '；');
      svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
        '<defs><radialGradient id="warn-grad"><stop offset="0%" stop-color="var(--accent2)" stop-opacity="0.1"/><stop offset="100%" stop-color="var(--accent2)" stop-opacity="0"/></radialGradient></defs>' +
        '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="8" fill="url(#warn-grad)"/>';
      var pos9 = [{x:10,y:10},{x:180,y:75},{x:10,y:140},{x:180,y:195}];
      for (var mi = 0; mi < Math.min(miscs.length, pos9.length); mi++) {
        var parts = miscs[mi].split('。')[0];
        var title = parts.split('：')[0];
        var detail = parts.split('：')[1] || '';
        var p9 = pos9[mi];
        svg += '<rect x="' + p9.x + '" y="' + p9.y + '" width="160" height="50" rx="6" fill="var(--red-soft)" stroke="#ef4444" stroke-width="1"/>';
        svg += '<text x="' + (p9.x+14) + '" y="' + (p9.y+24) + '" font-size="14">⚠️</text>';
        svg += '<text x="' + (p9.x+34) + '" y="' + (p9.y+18) + '" fill="var(--ink)" font-size="9" font-weight="700">' + esc(G.trunc(title, 12)) + '</text>';
        svg += '<text x="' + (p9.x+34) + '" y="' + (p9.y+34) + '" fill="var(--muted)" font-size="7">' + esc(G.trunc(detail, 20)) + '</text>';
      }
      svg += '<text x="' + G.cx + '" y="' + (H-8) + '" text-anchor="middle" font-size="7" fill="var(--muted)">不要重复别人的认知陷阱——起步前先看路标</text>';
      svg += '</svg>';
      break;

    case 10: // 工具箱 → Resource grid
      var rawResources = m.desc.split('；');
      var resources = [];
      rawResources.forEach(function(r) {
        var parts = r.trim().split('：');
        if (parts.length >= 2) {
          resources.push({cat: parts[0].replace(/^入门书|^经典著作|^在线课程|^工具|^社群|^实践项目|^.+?(?=：)/g,function(m){return m;}), name: parts[1].replace(/适合.*/,'').replace(/。/g,'').trim(), note: r});
        }
      });
      svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
      var t10pos = [
        {x:10,y:10,c:'入门'},{x:175,y:10,c:'经典'},
        {x:340,y:10,c:'课程'},{x:10,y:80,c:'工具'},
        {x:175,y:80,c:'社群'},{x:340,y:80,c:'实践'}
      ];
      for (var ri = 0; ri < t10pos.length; ri++) {
        var tp = t10pos[ri];
        svg += '<rect x="' + tp.x + '" y="' + tp.y + '" width="160" height="28" rx="5" fill="' + G.accent(ri) + '" stroke="' + G.border(ri) + '" stroke-width="1"/>';
        svg += '<text x="' + (tp.x + 80) + '" y="' + (tp.y + 18) + '" text-anchor="middle" font-size="8" font-weight="600" fill="var(--ink)">' + G.trunc(tp.c, 10) + '</text>';
      }
      // Show some resource names
      var shownRes = [];
      rawResources.forEach(function(r) {
        var parts = r.trim().split('：');
        if (parts.length >= 2) {
          var name = parts[1].split('适合')[0].split('。')[0].trim().substring(0, 12);
          shownRes.push(name);
        }
      });
      var rp = [
        {x:10,y:42},{x:175,y:42},{x:340,y:42},
        {x:10,y:112},{x:175,y:112},{x:340,y:112}
      ];
      for (var si = 0; si < Math.min(shownRes.length, rp.length); si++) {
        svg += '<text x="' + (rp[si].x + 80) + '" y="' + (rp[si].y + 8) + '" text-anchor="middle" font-size="7" fill="var(--muted)">' + esc(shownRes[si]) + '</text>';
      }
      svg += '<text x="' + G.cx + '" y="' + (H-6) + '" text-anchor="middle" font-size="7" fill="var(--muted)">选对工具，看对书，走对路</text>';
      svg += '</svg>';
      break;

    default:
      svg = '';
      break;
  }
  return svg;
}

// ===== Export =====
function goToExport() {
  exportScope = 'all';
  document.querySelectorAll('.scope-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.scope === 'all');
  });
  showPage('export');
}

function setScope(scope) {
  exportScope = scope;
  document.querySelectorAll('.scope-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.scope === scope);
  });
}

function doExport(format) {
  let content, filename, mime;
  const name = currentPath === 'fw' ? currentData.concept.name : currentData.conclusion.question;

  if (format === 'md') {
    content = generateMarkdown(name);
    filename = name + '.md';
    mime = 'text/markdown';
  } else {
    content = JSON.stringify(generateJSON(name), null, 2);
    filename = name + '.json';
    mime = 'application/json';
  }

  var blob = new Blob([content], { type: mime + ';charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出 ' + filename);
}

function generateMarkdown(name) {
  let md = '# ' + name + '\n\n';
  if (currentPath === 'fw') {
    const d = currentData;
    const includeAll = exportScope === 'all';
    if (includeAll || currentLayer === 0) {
      md += '## 概念核心定义\n\n';
      md += '**' + d.concept.name + '**\n\n';
      md += d.concept.definition + '\n\n';
      md += '> 本质：' + d.concept.essence + '\n\n';
    }
    if (includeAll || currentLayer === 1) {
      md += '## 框架体系\n\n';
      d.system.forEach(m => {
        md += '### ' + m.num + ' ' + m.name + '\n\n' + m.desc + '\n\n';
      });
    }
    if (includeAll || currentLayer === 2) {
      md += '## 学习路径\n\n';
      d.path.forEach(p => {
        md += '### ' + p.stage + '（' + p.time + '）\n\n' + p.content + '\n\n';
      });
    }
  } else {
    const d = currentData;
    const includeAll = exportScope === 'all';
    if (includeAll || currentLayer === 0) {
      md += '## 结论与权衡\n\n';
      md += '**问题：** ' + d.conclusion.question + '\n\n';
      md += '**结论：** ' + d.conclusion.verdictText + '\n\n';
      md += d.conclusion.tradeoff + '\n\n';
    }
    if (includeAll || currentLayer === 1) {
      md += '## 支撑维度\n\n';
      d.dimensions.forEach((m, i) => {
        md += '### ' + (i+1) + '. [' + m.typeName + '] ' + m.title + '\n\n' + m.detail + '\n\n';
      });
    }
    if (includeAll || currentLayer === 2) {
      md += '## 行动建议\n\n';
      d.actions.forEach((a, i) => {
        md += (i+1) + '. ' + a + '\n';
      });
      md += '\n### 备选方案\n\n';
      d.alternatives.forEach(a => {
        md += '- **' + a.title + '**：' + a.desc + '\n';
      });
    }
  }
  md += '\n---\n*由元框架引擎生成 · ' + new Date().toLocaleDateString('zh-CN') + ' · AI 生成，供参考*\n';
  return md;
}

function generateJSON(name) {
  if (exportScope === 'current') {
    if (currentPath === 'fw') {
      if (currentLayer === 0) return { layer: 0, type: 'concept', data: currentData.concept };
      if (currentLayer === 1) return { layer: 1, type: 'system', data: currentData.system };
      if (currentLayer === 2) return { layer: 2, type: 'path', data: currentData.path };
    } else {
      if (currentLayer === 0) return { layer: 0, type: 'conclusion', data: currentData.conclusion };
      if (currentLayer === 1) return { layer: 1, type: 'dimensions', data: currentData.dimensions };
      if (currentLayer === 2) return { layer: 2, type: 'actions', data: { actions: currentData.actions, alternatives: currentData.alternatives } };
    }
  }
  return { type: currentPath === 'fw' ? 'framework' : 'decision', query: name, data: currentData, generatedAt: new Date().toISOString() };
}

// ===== History Management =====
const HISTORY_KEY = '元框架引擎_history';
const MAX_HISTORY = 20;

function saveHistory(query, mode) {
  try {
    let list = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    // Remove duplicate
    list = list.filter(item => !(item.query === query && item.mode === mode));
    list.unshift({ query, mode, time: Date.now() });
    if (list.length > MAX_HISTORY) list = list.slice(0, MAX_HISTORY);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
    renderHistory();
  } catch(e) {}
}

function getHistory() {
  try {
    return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
  } catch(e) { return []; }
}

function clearHistory() {
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
  showToast('历史记录已清空');
}

function renderHistory() {
  const section = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  const items = getHistory();
  if (!items.length) {
    section.style.display = 'none';
    return;
  }
  section.style.display = '';
  const modeLabels = { fw: '框架', dc: '决策' };
  list.innerHTML = items.map(item => {
    const date = new Date(item.time);
    const timeStr = (date.getMonth()+1) + '/' + date.getDate() + ' ' + String(date.getHours()).padStart(2,'0') + ':' + String(date.getMinutes()).padStart(2,'0');
    return '<div class="history-item" onclick="loadFromHistory(&quot;' + item.query + '&quot;,&quot;' + item.mode + '&quot;)">' +
      '<span class="h-name">' + esc(item.query) + '</span>' +
      '<span class="h-meta">' +
        '<span class="h-mode ' + item.mode + '">' + modeLabels[item.mode] + '</span>' +
        '<span>' + timeStr + '</span>' +
      '</span>' +
    '</div>';
  }).join('');
}

function loadFromHistory(query, mode) {
  switchMode(mode);
  document.getElementById('searchInput').value = query;
  handleSearch();
}


// ===== Card Expansion =====
function toggleCardExpand(card) {
  const wasExpanded = card.classList.contains('expanded');
  // Close all other cards
  document.querySelectorAll('.sys-card.expanded').forEach(c => {
    if (c !== card) c.classList.remove('expanded');
  });
  // Toggle current
  card.classList.toggle('expanded', !wasExpanded);
}
var toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
