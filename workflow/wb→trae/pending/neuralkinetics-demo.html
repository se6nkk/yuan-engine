<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuralKinetics — Demo (代码版流体球)</title>
<link rel="stylesheet" href="neuralkinetics.css">
</head>
<body>
  <!-- 全局常驻流体球：同一份动画，亮/暗由系统(或手动)切换 -->
  <div class="blob-wrap" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="page">
    <nav class="nav">
      <div class="nav__logo">NeuralKinetics</div>
      <div class="nav__mid">
        <a class="pill pill--solid" href="#">＋ Menu</a>
        <a class="pill pill--ghost" href="#">Advanced Bionics</a>
        <a class="pill pill--ghost" href="#">Cognitive AI</a>
        <button class="pill pill--ghost" id="themeToggle" type="button">◐ 主题</button>
      </div>
    </nav>

    <header class="hero">
      <h1 class="display">NeuralKinetics</h1>
      <p class="lead"><span class="a">cybernetics</span> <span class="b">made organic</span></p>
    </header>

    <!-- 演示一个内容区块，证明 soft panel / 组件库可用 -->
    <main style="padding:0 40px 64px;">
      <div class="section-header reveal">
        <span class="eyebrow">Capabilities</span>
        <h2 class="h2">What it does <span style="color:var(--muted);font-weight:300;">做得到的事</span></h2>
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px;">
        <div class="panel reveal">
          <div class="eyebrow" style="margin-bottom:10px;">01</div>
          <h3 class="h2" style="font-size:20px;margin-bottom:8px;">Sense</h3>
          <p class="small">把生物信号转成机器可读的连续流。</p>
        </div>
        <div class="panel reveal">
          <div class="eyebrow" style="margin-bottom:10px;">02</div>
          <h3 class="h2" style="font-size:20px;margin-bottom:8px;">Model</h3>
          <p class="small">神经形态网络在边缘实时推理。</p>
        </div>
        <div class="panel reveal">
          <div class="eyebrow" style="margin-bottom:10px;">03</div>
          <h3 class="h2" style="font-size:20px;margin-bottom:8px;">Adapt</h3>
          <p class="small">随环境自调整，无需重训练。</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span>© 2026 NeuralKinetics</span>
      <span>
        <a href="#">Privacy</a><a href="#">Terms</a><a href="#">Contact</a>
      </span>
    </footer>
  </div>

  <script>
    // 区块入场（IntersectionObserver）
    const io = new IntersectionObserver((es)=>{
      es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('is-visible'); io.unobserve(e.target);} });
    },{threshold:.15});
    document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

    // 手动主题切换（预览用，覆盖系统设置；写入 data-theme）
    const root = document.documentElement;
    const btn = document.getElementById('themeToggle');
    const cur = () => getComputedStyle(root).getPropertyValue('--bg').trim();
    const isDark = () => matchMedia('(prefers-color-scheme: dark)').matches;
    btn.addEventListener('click', ()=>{
      const nowDark = root.getAttribute('data-theme')
        ? root.getAttribute('data-theme') === 'dark'
        : isDark();
      root.setAttribute('data-theme', nowDark ? 'light' : 'dark');
    });
  </script>
</body>
</html>
