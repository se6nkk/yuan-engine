<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 750" width="100%" font-family="-apple-system, system-ui, sans-serif">
<foreignObject x="44" y="10" width="592" height="52">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;line-height:1.6;color:#444441;display:flex;gap:7px;align-items:flex-start;"><span style="color:#993556;font-weight:500;">✗</span><span><b style="font-weight:500;">误区</b>：贝叶斯定理只能用来算罕见病的概率，日常生活根本用不上。</span></div>
</foreignObject>
<line x1="44" y1="68" x2="636" y2="68" stroke="#ededea" stroke-width="1"/>
<line x1="420" y1="76" x2="420" y2="172" stroke="#e3e1da" stroke-width="1"/>
<foreignObject x="44" y="74" width="368" height="104">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;line-height:1.6;color:#444441;display:flex;gap:7px;align-items:flex-start;"><span style="color:#0F6E56;font-weight:500;">✓</span><span><b style="font-weight:500;">正解</b>：凡是先有猜测、再看证据修正的场景都适用——垃圾邮件过滤、天气预测、金融风控、A/B 测试乃至日常判断。</span></div>
</foreignObject>
<foreignObject x="430" y="74" width="206" height="104">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;line-height:1.55;color:#888780;display:flex;gap:7px;align-items:flex-start;"><span style="color:#888780;">•</span><span><b style="font-weight:500;color:#888780;">洞察</b>：贝叶斯不是罕见场景的专用工具，而是一种信念随证据校准的通用思维方式。</span></div>
</foreignObject>
<foreignObject x="44" y="190" width="592" height="52">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;line-height:1.6;color:#444441;display:flex;gap:7px;align-items:flex-start;"><span style="color:#993556;font-weight:500;">✗</span><span><b style="font-weight:500;">误区</b>：先验概率是拍脑袋的主观臆断，不科学。</span></div>
</foreignObject>
<line x1="44" y1="248" x2="636" y2="248" stroke="#ededea" stroke-width="1"/>
<line x1="420" y1="256" x2="420" y2="352" stroke="#e3e1da" stroke-width="1"/>
<foreignObject x="44" y="254" width="368" height="104">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;line-height:1.6;color:#444441;display:flex;gap:7px;align-items:flex-start;"><span style="color:#0F6E56;font-weight:500;">✓</span><span><b style="font-weight:500;">正解</b>：先验可来自历史频率、专家共识或无信息先验；关键在于它会被证据持续修正，而非必须一开始就绝对正确。</span></div>
</foreignObject>
<foreignObject x="430" y="254" width="206" height="104">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;line-height:1.55;color:#888780;display:flex;gap:7px;align-items:flex-start;"><span style="color:#888780;">•</span><span><b style="font-weight:500;color:#888780;">洞察</b>：科学从不要求起点绝对正确，只要求更新机制可被证伪与修正。</span></div>
</foreignObject>
<foreignObject x="44" y="370" width="592" height="52">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;line-height:1.6;color:#444441;display:flex;gap:7px;align-items:flex-start;"><span style="color:#993556;font-weight:500;">✗</span><span><b style="font-weight:500;">误区</b>：算出后验概率就等于得到了真相，结论确定了。</span></div>
</foreignObject>
<line x1="44" y1="428" x2="636" y2="428" stroke="#ededea" stroke-width="1"/>
<line x1="420" y1="436" x2="420" y2="532" stroke="#e3e1da" stroke-width="1"/>
<foreignObject x="44" y="434" width="368" height="104">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;line-height:1.6;color:#444441;display:flex;gap:7px;align-items:flex-start;"><span style="color:#0F6E56;font-weight:500;">✓</span><span><b style="font-weight:500;">正解</b>：后验仍是概率分布，表示在当前证据下信念的强度；新证据一来，它会再次更新。</span></div>
</foreignObject>
<foreignObject x="430" y="434" width="206" height="104">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;line-height:1.55;color:#888780;display:flex;gap:7px;align-items:flex-start;"><span style="color:#888780;">•</span><span><b style="font-weight:500;color:#888780;">洞察</b>：贝叶斯输出的是经过校准的不确定性，不是非黑即白的真相。</span></div>
</foreignObject>
<foreignObject x="44" y="550" width="592" height="52">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;line-height:1.6;color:#444441;display:flex;gap:7px;align-items:flex-start;"><span style="color:#993556;font-weight:500;">✗</span><span><b style="font-weight:500;">误区</b>：P(A|B) 和 P(B|A) 是一回事，经常混着用。</span></div>
</foreignObject>
<line x1="44" y1="608" x2="636" y2="608" stroke="#ededea" stroke-width="1"/>
<line x1="420" y1="616" x2="420" y2="712" stroke="#e3e1da" stroke-width="1"/>
<foreignObject x="44" y="614" width="368" height="104">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;line-height:1.6;color:#444441;display:flex;gap:7px;align-items:flex-start;"><span style="color:#0F6E56;font-weight:500;">✓</span><span><b style="font-weight:500;">正解</b>：二者通过 P(B) 与 P(A) 缩放关联——混淆它们正是检察官谬误与基础概率谬误的根源。</span></div>
</foreignObject>
<foreignObject x="430" y="614" width="206" height="104">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;line-height:1.55;color:#888780;display:flex;gap:7px;align-items:flex-start;"><span style="color:#888780;">•</span><span><b style="font-weight:500;color:#888780;">洞察</b>：条件概率的方向性，是逆概率问题的核心，也是最常见的误用点。</span></div>
</foreignObject>
</svg>